<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Meeting Buddy - Camera & Microphone</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }
    video {
      width: 70%;
      max-width: 600px;
      border: 3px solid #333;
      border-radius: 12px;
      margin-top: 20px;
    }
    button {
      padding: 12px 20px;
      margin-top: 20px;
      border: none;
      border-radius: 8px;
      background-color: #007bff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <h1>🎥 AI Meeting Buddy</h1>
  <p>Click the button below to allow camera and microphone access.</p>

  <button id="startBtn">Start Camera & Microphone</button>
  <br>
  <video id="videoElement" autoplay playsinline></video>

  <script>
    const button = document.getElementById('startBtn');
    const video = document.getElementById('videoElement');

    button.addEventListener('click', async () => {
      try {
        // Request camera and microphone
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        video.srcObject = stream;
      } catch (error) {
        alert("Error: " + error.message + "\n\nRun this file using 'http://localhost' instead of 'file://'");
        console.error(error);
      }
    });
  </script>
</body>
</html>
