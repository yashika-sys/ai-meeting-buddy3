<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Meeting - Live</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 0;
    }

    .meeting-container {
      max-width: 900px;
      margin: 3rem auto;
      background: white;
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      text-align: center;
    }

    h2 {
      color: #1e293b;
      margin-bottom: 1rem;
    }

    .meeting-video {
      width: 100%;
      height: 400px;
      background: #d1d5db;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      margin-bottom: 1.5rem;
      color: #4b5563;
      font-size: 1.2rem;
    }

    .controls button {
      padding: 0.7rem 1.5rem;
      margin: 0.5rem;
      font-size: 1rem;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      color: white;
      transition: 0.3s;
    }

    .controls .mute { background: #ef4444; }
    .controls .mute:hover { background: #b91c1c; }

    .controls .end { background: #3b82f6; }
    .controls .end:hover { background: #2563eb; }

    .controls .share { background: #10b981; }
    .controls .share:hover { background: #059669; }
  </style>
</head>
<body>

  <div class="meeting-container">
    <h2>AI Meeting Live</h2>
    <div class="meeting-video">
      Video Stream / AI Meeting Here
    </div>
    <div class="controls">
      <button class="mute" onclick="alert('Muted!')">Mute</button>
      <button class="end" onclick="alert('Meeting Ended!')">End Meeting</button>
      <button class="share" onclick="alert('Link Shared!')">Share Link</button>
    </div>
  </div>

</body>
</html>
